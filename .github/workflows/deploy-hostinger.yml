name: Deploy Hermes Agent RM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-agent-rm-hostinger
  cancel-in-progress: false

jobs:
  test-build-deploy:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}:hermes-agent-rm-${{ github.sha }}
      DEPLOY_DIR: /home/mrrobot/apps/hermes-agent-rm
      TRAEFIK_HOST: hermes-agent-rm.romulomartins.io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test deployment and recovery
        env:
          HERMES_DEPLOY_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s deploy/hostinger -p 'test_*.py' -v

      - name: Verify deployment configuration
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          DASHBOARD_USERNAME: ${{ secrets.HERMES_AGENT_RM_DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD_HASH: ${{ secrets.HERMES_AGENT_RM_DASHBOARD_PASSWORD_HASH }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.HERMES_AGENT_RM_DASHBOARD_SESSION_SECRET }}
        run: |
          test -n "$GHCR_PULL_TOKEN"
          test -n "$HOSTINGER_SSH_HOST"
          test -n "$HOSTINGER_SSH_USER"
          test -n "$HOSTINGER_SSH_PRIVATE_KEY"
          test -n "$HOSTINGER_SSH_KNOWN_HOSTS"
          test -n "$DASHBOARD_USERNAME"
          test -n "$DASHBOARD_PASSWORD_HASH"
          test -n "$DASHBOARD_SESSION_SECRET"

      - name: Test Morpheus plugin in Docker
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace python:3.13-slim sh -lc
          'python -m pip install --disable-pip-version-check -q uv==0.9.28 &&
          uv sync --locked --no-install-project --extra dev --extra web &&
          scripts/run_tests.sh tests/hermes_cli/test_morpheus_plugin.py'

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push image
        run: |
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          digest_ref=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          case "$digest_ref" in
            ghcr.io/${{ github.repository }}@sha256:*) ;;
            *) echo 'Missing pushed image digest' >&2; exit 1 ;;
          esac
          echo "IMAGE=$digest_ref" >> "$GITHUB_ENV"

      - name: Configure SSH
        id: ssh
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload isolated deployment definition
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          target="$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST"
          bundle="$DEPLOY_DIR/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "$target" "mkdir -p '$bundle'"
          scp deploy/hostinger/docker-compose.yml "$target:$bundle/docker-compose.next.yml"
          scp deploy/hostinger/deploy.sh deploy/hostinger/deploy.py deploy/hostinger/probe.py "$target:$bundle/"
          ssh "$target" "chmod 700 '$bundle/deploy.sh'"

      - name: Deploy and verify through Traefik
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DASHBOARD_USERNAME: ${{ secrets.HERMES_AGENT_RM_DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD_HASH: ${{ secrets.HERMES_AGENT_RM_DASHBOARD_PASSWORD_HASH }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.HERMES_AGENT_RM_DASHBOARD_SESSION_SECRET }}
        run: |
          test -n "$GHCR_PULL_TOKEN"
          test -n "$DASHBOARD_USERNAME"
          test -n "$DASHBOARD_PASSWORD_HASH"
          test -n "$DASHBOARD_SESSION_SECRET"
          umask 077
          bash deploy/hostinger/write-env.sh > .hostinger.env
          target="$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST"
          bundle="$DEPLOY_DIR/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scp .hostinger.env "$target:$bundle/.env.next"
          rm -f .hostinger.env
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "$target" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin && cd '$DEPLOY_DIR' && DEPLOY_SHA='$GITHUB_SHA' DEPLOY_RUN_ID='$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT' '$bundle/deploy.sh' --directory '$DEPLOY_DIR' --candidate-dir '$bundle'; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

      - name: Collect sanitized deployment receipt
        if: always() && steps.ssh.outcome == 'success'
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          target="$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST"
          scp "$target:$DEPLOY_DIR/receipt.json" receipt.download.json
          python3 - <<'PYCODE'
          import json, os, pathlib
          path = pathlib.Path('receipt.download.json')
          data = json.loads(path.read_text())
          assert data['sha'] == os.environ['GITHUB_SHA'], 'Receipt belongs to another SHA'
          assert data['workflow_run'] == os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'], 'Stale receipt'
          path.rename('deployment-receipt.json')
          PYCODE

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment-receipt.json
          if-no-files-found: ignore
          retention-days: 30
