name: Deployment configuration tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate literal credentials with Docker Compose
        run: python3 -m unittest discover -s deploy/hostinger -p 'test_*.py' -v
